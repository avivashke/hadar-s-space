<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hadar English Quest – זמנים ופעלים</title>
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--tx:#f8fafc;--mu:#94a3b8;--blue:#38bdf8;--green:#34d399;--pink:#f472b6;--purple:#c084fc;--amber:#fbbf24;--red:#f87171;--bd:#334155;--r:16px;--r2:10px}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.6;padding-bottom:80px}
.container{max-width:1000px;margin:0 auto;padding:14px}
button{cursor:pointer;color:inherit}
.btn{background:var(--bg3);border:1px solid #475569;color:var(--tx);padding:9px 15px;border-radius:var(--r2);font-weight:700;font-size:.9rem;transition:.15s}
.btn:hover{background:#475569;transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-main{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:#16a34a;color:#fff}
.btn-blue{background:linear-gradient(135deg,#0ea5e9,#2563eb);border-color:#2563eb;color:#fff}
.btn-wa{background:linear-gradient(135deg,#25d366,#128c7e);border-color:#128c7e;color:#fff}
.btn-red{background:rgba(248,113,113,.15);border-color:rgba(248,113,113,.4);color:#fca5a5}
.btn-sm{padding:5px 10px;font-size:.8rem}
header{background:linear-gradient(145deg,#1e293b,#0f172a);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:0 10px 25px -5px rgba(0,0,0,.4)}
.h-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.title{font-size:1.5rem;font-weight:800;background:linear-gradient(90deg,#38bdf8,#f472b6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
.stat{background:rgba(15,23,42,.6);border:1px solid var(--bd);padding:10px;border-radius:var(--r2);text-align:center}
.stat b{display:block;font-size:1.3rem;color:var(--blue)}.stat span{font-size:.78rem;color:var(--mu)}
.bar{height:10px;background:var(--bg3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#34d399);border-radius:99px;transition:width .4s}
/* readiness board */
.board{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:16px}
.board-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--bg3) 0);display:grid;place-items:center;flex:none}
.ring div{width:74px;height:74px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-weight:800;font-size:1.3rem}
.brow{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid var(--bd);cursor:pointer}
.brow:hover{background:rgba(255,255,255,.03)}
.pill{font-size:.74rem;font-weight:800;padding:3px 8px;border-radius:99px;text-align:center;color:#0f172a}
.s0{background:#94a3b8}.s1{background:var(--amber)}.s2{background:#fb923c}.s3{background:var(--green)}.s4{background:var(--blue)}
/* tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px}
.tab{background:var(--bg2);border:1px solid var(--bd);color:var(--mu);padding:11px 16px;border-radius:var(--r2);font-weight:700;white-space:nowrap;transition:.15s}
.tab.active{background:linear-gradient(135deg,rgba(56,189,248,.2),rgba(192,132,252,.2));border-color:var(--blue);color:var(--blue)}
.tab-content{display:none;animation:fi .3s}.tab-content.active{display:block}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* intro */
details.intro{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
details.intro>summary{padding:14px 18px;font-weight:800;color:var(--blue);cursor:pointer;font-size:1.05rem;list-style:none}
details.intro>summary::before{content:'▾ '}
.intro-body{padding:4px 18px 18px}
.intro-body h4{margin:14px 0 6px;color:var(--amber)}
.rule{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.35);border-radius:var(--r2);padding:10px 14px;margin:8px 0;transition:.3s}
.rule.flash{box-shadow:0 0 0 3px var(--amber);background:rgba(251,191,36,.2)}
.rule b.t{color:var(--amber)}.rule .ex{color:#a5f3fc;font-size:.92rem;direction:ltr;text-align:left;margin-top:4px}
.rule .xc{color:#fca5a5;font-size:.9rem;margin-top:4px}
table.gt{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92rem;display:block;overflow-x:auto}
.gt th{background:var(--bg3);padding:8px;text-align:right}.gt td{padding:8px;border-bottom:1px solid var(--bd)}
.en-word{color:var(--blue);border-bottom:1.5px dashed var(--blue);cursor:pointer;font-weight:700;direction:ltr;display:inline-block}
.th-box{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin:10px 0}
.th-card{border-radius:var(--r2);padding:12px;border:1px solid}
.th0{background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.4)}.th1{background:rgba(244,114,182,.08);border-color:rgba(244,114,182,.4)}
.say{display:inline-flex;gap:4px;align-items:center;background:var(--bg3);border:1px solid #475569;border-radius:99px;padding:3px 10px;margin:3px;font-size:.88rem;direction:ltr}
/* lesson */
.lesson{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.l-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.l-top .grp{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:99px;background:rgba(52,211,153,.2);color:var(--green)}
.exmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:10px 0}
.exmap button{padding:7px 0;border-radius:8px;border:1px solid var(--bd);background:var(--bg);font-weight:700;font-size:.82rem}
.exmap .d1{background:rgba(52,211,153,.25);border-color:var(--green)}.exmap .d2{background:rgba(251,191,36,.2);border-color:var(--amber)}.exmap .cur{outline:2px solid var(--blue)}
.xcard{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-top:12px}
.q{font-size:1.15rem;font-weight:700;margin-bottom:14px}
.q .en{direction:ltr;display:inline-block;color:#e0f2fe}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{background:var(--bg2);border:2px solid var(--bd);padding:13px;border-radius:var(--r2);font-weight:700;font-size:1rem;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--blue);transform:translateY(-2px)}
.opt.ok{background:rgba(52,211,153,.25);border-color:var(--green)}.opt.no{background:rgba(248,113,113,.2);border-color:var(--red);opacity:.6}
.opt.ltr{direction:ltr}
input.txt{width:100%;background:var(--bg2);border:2px solid var(--bd);border-radius:var(--r2);padding:12px;font-size:1.15rem;color:var(--tx);outline:none}
input.txt:focus{border-color:var(--blue)}input.ltr{direction:ltr;text-align:left}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.scr-zone{min-height:54px;border:2px dashed #475569;border-radius:var(--r2);padding:8px;display:flex;flex-wrap:wrap;gap:8px;direction:ltr;margin-bottom:10px}
.tok{background:var(--bg3);border:1px solid #64748b;border-radius:8px;padding:8px 13px;font-weight:700;font-size:1.05rem;direction:ltr}
.tok:hover{background:#475569}.tok.used{opacity:.25;pointer-events:none}
.fb{margin-top:14px;border-radius:var(--r2);padding:12px 14px;animation:fi .25s}
.fb.ok{background:rgba(52,211,153,.12);border:1px solid var(--green)}.fb.bad{background:rgba(248,113,113,.1);border:1px solid var(--red)}.fb.info{background:rgba(56,189,248,.1);border:1px solid var(--blue)}
.fb .rl{background:rgba(251,191,36,.1);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:.92rem}
.fb .an{margin-top:8px;color:#fcd34d;font-size:.9rem}
.pat{font-family:monospace;font-size:1.3rem;letter-spacing:3px;direction:ltr;display:inline-block;color:var(--amber)}
.mic{width:76px;height:76px;border-radius:50%;border:none;font-size:2rem;background:linear-gradient(135deg,#ec4899,#8b5cf6);box-shadow:0 0 0 0 rgba(236,72,153,.6)}
.mic.rec{animation:pulse 1s infinite;background:#ef4444}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.speak-sent{font-size:1.7rem;font-weight:800;direction:ltr;text-align:center;margin:10px 0;color:#e0f2fe}
.heard{background:var(--bg2);border-radius:8px;padding:8px 12px;direction:ltr;text-align:left;margin-top:8px;color:#cbd5e1}
.heard .w-ok{color:var(--green)}.heard .w-no{color:var(--red);text-decoration:underline wavy}
/* flashcards */
.fc-wrap{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:16px}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
select.sel{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
.flip{perspective:1000px;height:230px;cursor:pointer;margin:12px 0}
.flip-in{position:relative;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center}
.front{background:linear-gradient(145deg,#1e3a8a,#312e81)}.back{background:linear-gradient(145deg,#831843,#6d28d9);transform:rotateY(180deg)}
.fc-en{font-size:2.6rem;font-weight:800;direction:ltr}.fc-he{font-size:2.2rem;font-weight:800}
.fc-tag{font-size:.74rem;padding:3px 10px;border-radius:99px;background:rgba(251,191,36,.25);color:var(--amber);margin-bottom:8px;font-weight:800}
.fc-timer{height:6px;background:var(--bg3);border-radius:9px;overflow:hidden}.fc-timer i{display:block;height:100%;background:var(--amber);width:100%}
.proof{background:var(--bg);border:1px solid var(--purple);border-radius:var(--r2);padding:12px;margin-top:10px}
/* exam */
.exam-bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;background:var(--bg2);border:1px solid #78350f;padding:10px 14px;border-radius:var(--r2);margin-bottom:12px;position:sticky;top:0;z-index:5}
.report{background:var(--bg);border:2px solid var(--green);border-radius:var(--r);padding:18px;margin-top:16px}
.trow{display:grid;grid-template-columns:130px 1fr 60px;gap:8px;align-items:center;margin:6px 0}
/* modal/bubble/toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}
.modal-bg.show{display:flex}.modal{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
textarea.rep{width:100%;height:240px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px;font-size:.88rem;direction:rtl;resize:vertical}
#bubble{position:fixed;display:none;background:#0b1220;border:1px solid var(--blue);border-radius:12px;padding:10px 14px;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.6);max-width:260px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;border:1px solid var(--amber);padding:10px 18px;border-radius:99px;z-index:120;display:none;font-weight:700}
.xpfloat{position:fixed;font-weight:800;color:var(--amber);z-index:110;pointer-events:none;animation:up 1s forwards}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.conf{position:fixed;top:-20px;font-size:1.6rem;z-index:130;pointer-events:none;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media(max-width:600px){.brow{grid-template-columns:100px 1fr 80px;font-size:.85rem}.title{font-size:1.2rem}.fc-en{font-size:2rem}}
</style>
</head>
<body>
<div class="modal-bg" id="m-reset"><div class="modal"><h3 style="color:var(--red)">איפוס כל ההתקדמות?</h3><p style="margin:10px 0">כל הנקודות, התרגילים, הכרטיסיות והמבחן יימחקו ולא ניתן יהיה לשחזר אותם.</p><div class="row"><button class="btn" onclick="closeM('m-reset')">ביטול</button><button class="btn btn-red" onclick="doReset()">כן, לאפס הכל</button></div></div></div>
<div class="modal-bg" id="m-wa"><div class="modal"><h3>📤 דוח התקדמות לוואטסאפ</h3><p style="color:var(--mu);font-size:.88rem;margin:6px 0">כך ייראה הדוח. אפשר לערוך לפני השליחה.</p><textarea class="rep" id="wa-text"></textarea>
<label style="display:block;margin-top:8px;font-size:.88rem">מספר וואטסאפ של ההורה (לא חובה – נשמר במכשיר):<input class="txt ltr" id="wa-phone" placeholder="05X-XXXXXXX" inputmode="tel" style="padding:8px;font-size:1rem"></label>
<div class="row"><button class="btn btn-wa" onclick="sendWA()">📤 שליחה בוואטסאפ</button><button class="btn" onclick="copyRep()">📋 העתקה</button><button class="btn" onclick="closeM('m-wa')">סגירה</button></div></div></div>
<div id="bubble"></div><div id="toast"></div>

<div class="container">
<header>
  <div class="h-top">
    <div><h1 class="title">שלום הדר! מוכן להצליח באנגלית? 🌟</h1><p style="color:var(--mu);font-size:.88rem">זמנים · פעלים רגילים ולא רגילים · Be | ההתקדמות נשמרת אוטומטית 💾</p></div>
    <div class="acts">
      <button class="btn btn-wa" onclick="openWA()">📤 שליחת דוח התקדמות בוואטסאפ</button>
      <button class="btn" id="snd-btn" onclick="toggleSound()">🔊</button>
      <button class="btn btn-red" onclick="openM('m-reset')">🔄 איפוס</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="bar" style="margin-top:14px"><i id="lvl-bar" style="width:0"></i></div>
</header>

<section class="board">
  <div class="board-top">
    <div class="ring" id="ring"><div id="ring-t">0%</div></div>
    <div style="flex:1;min-width:200px"><h3 id="ready-title">מוכנות למבחן</h3><p id="ready-sub" style="color:var(--mu);font-size:.9rem"></p></div>
  </div>
  <div id="board-rows"></div>
</section>

<nav class="tabs" id="tabs"></nav>
<div id="panes"></div>
</div>
<script>
/* ===================== HELPERS ===================== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const CONTR={"didn't":"did not","doesn't":"does not","don't":"do not","won't":"will not","wasn't":"was not","weren't":"were not","can't":"can not","i'll":"i will","you'll":"you will","he'll":"he will","she'll":"she will","we'll":"we will","they'll":"they will","it'll":"it will","i'm":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are","isn't":"is not","aren't":"are not"};
function normEN(s){s=String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.,!?;:"]/g,' ').replace(/\s+/g,' ').trim();return s.split(' ').map(w=>CONTR[w]||w).join(' ').replace(/\s+/g,' ').trim()}
function normHE(s){return String(s).replace(/[\u0591-\u05C7]/g,'').replace(/["'׳״.,!?()\-]/g,' ').replace(/\s+/g,' ').trim()}
function heAlts(he){return he.split(/[\/,(]/).map(x=>normHE(x.replace(')','')).trim()).filter(Boolean)}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
/* thin-hint ladder: 1 count · 2 first letters · 3 matching letters · 4 half the word · 5 reveal */
function thinHint(target,guess,lvl){
  const tw=target.split(' '),gw=guess.trim().split(/\s+/).filter(Boolean),he=/[\u0590-\u05FF]/.test(target),dir=he?'rtl':'ltr';
  if(lvl>=5)return `התשובה היא: <span class="pat" dir="${dir}" style="color:var(--green)">${esc(target)}</span>`;
  if(lvl<=1){let s=tw.length>1?`במשפט צריכות להיות <b>${tw.length}</b> מילים`:`במילה יש <b>${target.length}</b> אותיות`;
    if(tw.length>1&&gw.length&&gw.length!==tw.length)s+=` (אתה כתבת ${gw.length})`;else if(tw.length===1&&guess.trim()&&guess.trim().length!==target.length)s+=` (אתה כתבת ${guess.trim().length})`;return s+'.'}
  if(lvl===2)return `האות הראשונה בכל מילה: <span class="pat" dir="${dir}">${tw.map(w=>w[0]+'…').join('  ')}</span>`;
  const out=tw.map((w,i)=>{const g=gw[i]||'';if(g.toLowerCase()===w.toLowerCase())return w;const keep=lvl>=4?Math.ceil(w.length/2):1;
    return [...w].map((c,j)=>(j<keep||(g[j]&&g[j].toLowerCase()===c.toLowerCase()))?c:'_').join('')});
  return `ככה זה נראה (אותיות נכונות + רמז): <span class="pat" dir="${dir}">${out.join('   ')}</span>`}
/* speech */
let VOICE=null;
function initVoice(){if(!('speechSynthesis'in window))return;const f=()=>{const v=speechSynthesis.getVoices();VOICE=v.find(x=>/^en[-_]US/i.test(x.lang)&&/Google|Natural|Samantha|Siri|Aria/i.test(x.name))||v.find(x=>/^en/i.test(x.lang))||null};f();speechSynthesis.onvoiceschanged=f}
function speak(t,rate=.9){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]*>/g,''));u.lang='en-US';u.rate=rate;if(VOICE)u.voice=VOICE;speechSynthesis.speak(u)}
function listenOnce(lang,onRes,onErr,onEnd){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){onErr('unsupported');return null}
  const r=new R();r.lang=lang;r.interimResults=false;r.maxAlternatives=5;let got=false;
  r.onresult=e=>{got=true;onRes([...e.results[0]].map(a=>a.transcript))};
  r.onerror=e=>{got=true;onErr(e.error)};
  r.onend=()=>{if(!got)onErr('no-speech');onEnd&&onEnd()};
  try{r.start()}catch(e){onErr('start');return null}return r}
/* sound */
let AC=null;
function beep(ok){if(typeof S!=='undefined'&&!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const seq=ok?[[660,.0],[880,.12]]:[[220,0]];seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type=ok?'sine':'triangle';g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+d);o.stop(AC.currentTime+d+.18)})}catch(e){}}
/* ===================== DATA – Hadar ===================== */
const W=[

function examReport(ex){
  const sc=ex.correct*5,col=sc>=85?'var(--green)':sc>=60?'var(--amber)':'var(--red)';
  const msg=sc>=90?'מדהים הדר! אתה מוכן למבחן 🏆':sc>=75?'עבודה יפה! עוד קצת חיזוק ואתה שם 💪':sc>=55?'בדרך הנכונה – חזור על הכללים בנושאים החלשים 📘':'זה בסדר! כל טעות היא הזדמנות ללמוד. חזור להסברים ותרגל עוד 🌱';
  const wrong=ex.qs.filter(qi=>ex.a[qi]!==EXAM_POOL[qi].ans);
  return `<div class="report"><h2 style="color:${col}">🎉 תוצאות המבחן: ${sc} / 100</h2><p style="margin:6px 0">${msg}</p>${TOPICS.map(t=>{const p=ex.by[t.k]/4*100;return `<div class="trow"><span>${t.i} ${t.n}</span><div class="bar"><i style="width:${p}%"></i></div><b>${ex.by[t.k]}/4</b></div>`}).join('')}
  ${wrong.length?`<h4 style="margin:14px 0 6px;color:var(--amber)">🔎 לחזרה – ${wrong.length} שאלות</h4>`+wrong.map(qi=>{const q=EXAM_POOL[qi],r=RULES[q.rule];return `<div class="fb bad" style="margin-bottom:8px"><div>${q.q.replace('___','_____')}</div><div>✅ התשובה: <b dir="ltr">${esc(q.ans)}</b>${ex.a[qi]?` · ענית: <span dir="ltr">${esc(ex.a[qi])}</span>`:' · לא נענתה'}</div>${r?`<div class="rl">📘 <b>${r.t}:</b> ${r.d}</div>`:''}</div>`}).join(''):'<p>✅ כל התשובות נכונות! 🌟</p>'}
  <div class="row"><button class="btn btn-wa" onclick="openWA()">📤 שליחת התוצאות בוואטסאפ</button><button class="btn btn-main" onclick="S.exam=null;save();renderExam()">🔁 מבחן חדש</button></div></div>`}
/* ===================== TRANSLATION BUBBLE ===================== */
const DICT={};FULL.forEach(c=>DICT[c.en.toLowerCase()]=c.he);
R.concat(I).forEach(v=>{DICT[v[1]]=v[3]+' (עבר של '+v[0]+')';DICT[v[2]]=v[3]+' (he/she/it)';DICT['will '+v[0]]=v[3]+' (עתיד)'});Object.assign(DICT,{am:'(Be) I am',is:'(Be) he/she/it is',are:'(Be) we/you/they are',was:'(Be בעבר) I/he/she/it was',were:'(Be בעבר) we/you/they were','will be':'(Be בעתיד) יהיה',will:'מילת עתיד',not:'לא',did:'מילת עזר לעבר',does:'מילת עזר להווה',"isn't":'is not',"aren't":'are not',"wasn't":'was not',"weren't":'were not',"didn't":'did not',"doesn't":'does not',"won't":'will not'});
function showBubble(el){const w=el.textContent.trim(),he=DICT[w.toLowerCase()],b=$('#bubble');b.innerHTML=`<div dir="ltr" style="font-weight:800;color:var(--blue)">${esc(w)}</div>${he?`<div style="margin:4px 0">${he}</div>`:''}<button class="btn btn-sm" onclick="speak('${w.replace(/'/g,"\\'")}')">🔊 השמעה</button>`;b.style.display='block';
  const r=el.getBoundingClientRect();b.style.top=Math.min(innerHeight-110,r.bottom+8)+'px';b.style.left=Math.max(8,Math.min(innerWidth-270,r.left))+'px';speak(w)}
document.addEventListener('click',e=>{const w=e.target.closest('.en-word');if(w&&!w.closest('#bubble')){showBubble(w)}else if(!e.target.closest('#bubble'))$('#bubble').style.display='none'});
/* ===================== INIT ===================== */
function init(){loadState();initVoice();build();updateAll();for(let t=0;t<6;t++)renderLesson(t);renderLesson(6);renderCard();renderExam();switchTab(Math.min(7,S.tab||0));save()}
window.addEventListener('DOMContentLoaded',init);

</script>
</body>
</html>
